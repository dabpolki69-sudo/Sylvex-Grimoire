name: Sylvex Script tests
on:
  push:
    paths:
      - 'sylvex_script.py'
      - 'sylvex_semantic.py'
      - 'sylvex_compact.py'
      - 'sylvexc.py'
      - 'sylvexs.py'
      - 'SYLVEX_*SPEC*.md'
      - 'tests/**'
      - 'examples/**'
      - 'benchmarks/**'
      - '.github/workflows/sylvex-script.yml'
  pull_request:
    paths:
      - 'sylvex_script.py'
      - 'sylvex_semantic.py'
      - 'sylvex_compact.py'
      - 'sylvexc.py'
      - 'sylvexs.py'
      - 'SYLVEX_*SPEC*.md'
      - 'tests/**'
      - 'examples/**'
      - 'benchmarks/**'
      - '.github/workflows/sylvex-script.yml'
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m unittest discover -s tests -v
      - run: python sylvex_script.py examples/hello.slx --json
      - run: python sylvex_script.py examples/evidence.slx --json
      - run: python sylvexc.py compile examples/evidence.slx
      - run: python sylvexc.py run examples/evidence.slxb --json
      - run: python sylvexs.py examples/sol_stalker_0_2.slx --compact
      - run: python sylvexs.py examples/sol_stalker_0_3.slx --compact
      - run: python benchmarks/size_benchmark.py
